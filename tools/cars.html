<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Bilar — look-dev</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8a9aa8; }
    #app { position: fixed; inset: 0; }
    #lbl { position: fixed; left: 14px; top: 10px; color: #fff; font: 600 18px "Barlow Condensed", sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.6); letter-spacing: .02em; }
    #stats { position: fixed; right: 14px; top: 10px; color: #fff; font: 13px monospace; text-shadow: 0 1px 2px rgba(0,0,0,.7); text-align: right; white-space: pre; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="lbl"></div>
  <div id="stats"></div>
  <script type="module">
    // Standalone car look-dev: every car type on a plowed, damp street and on an open asphalt lot
    // in the low winter sun.
    //   node tools/pageshot.mjs tools/cars.html cars        (one PNG per view in window.__views)
    //   QUERY='?only=saab_side,saab_front' node tools/pageshot.mjs tools/cars.html cars
    //   tools/cars.html?view=saab_front34                   (open one view)
    // Views: lineup*, saab_* (side/front/rear also as long-lens '_ortho' elevations for comparing
    // with photos), <kind>_34 / _rear34 / _front / _side / _plate / _hazard per type, trailer,
    // trailer_side, parked_snow, lod_near / lod_far, and (only on request) spin0..spin7: the Golf
    // turned through 360° against the sun, for checking that no window blows out.
    import { THREE, initGfx, gfxReady, scene, camera, renderer, renderFrame, GeoBuilder, realMesh, setRoadGrid, gfxStats } from '../src/gfx.js';
    import { fx } from '../src/game/fx.js';
    import { Car, CAR_TYPES } from '../src/actors/car.js';
    import { MODEL_KEYS, carModel, wheelStats } from '../src/actors/carmodels.js';
    import { buildBust, randomPed, CHARS } from '../src/actors/models.js';
    import { mulberry32 } from '../src/util.js';

    const params = new URLSearchParams(location.search);
    initGfx(document.getElementById('app'));
    await gfxReady;
    fx.init(scene);
    setRoadGrid({ pitch: 1000, offset: 0, halfWidth: 7, lane: 3, extent: 60 });

    // Ground: a 320 m street along x with kerbs, sidewalks, snow banks and snowy lawns; south of it
    // (+z) an open asphalt lot (z 22..110) for the studio row, with a snow bank only at its far edge.
    const g = new GeoBuilder();
    g.use('asphalt').boxB(null, 0, -0.2, 0, 320, 0.2, 14);
    g.use('marking');
    for (let k = -32; k < 32; k++) g.boxB(0xdcdcd6, k * 5 + 1.5, 0.0, 0, 3, 0.004, 0.12);
    for (const s of [1, -1]) {
      g.use('concrete').boxB(0x9a9a96, 0, -0.2, s * 7.1, 320, 0.35, 0.2);
      g.use('paving').boxB(null, 0, -0.2, s * 9, 320, 0.35, 3.6);
      for (let k = -32; k < 32; k++) g.use('snow').add(new THREE.SphereGeometry(1, 10, 6), null, new THREE.Matrix4().compose(new THREE.Vector3(k * 5 + 2, 0.12, s * 7.3), new THREE.Quaternion(), new THREE.Vector3(2.4, 0.42, 0.45)));
    }
    g.use('snow').boxB(null, 0, -0.2, -60, 320, 0.4, 98);
    g.use('snow').boxB(null, 0, -0.2, 16, 320, 0.4, 10);
    g.use('asphalt').boxB(null, 0, -0.2, 66, 420, 0.2, 88);
    g.use('snow').boxB(null, 0, -0.2, 200, 420, 0.4, 180);
    g.use('snow').add(new THREE.SphereGeometry(1, 16, 8), null, new THREE.Matrix4().compose(new THREE.Vector3(0, 0.1, 111), new THREE.Quaternion(), new THREE.Vector3(200, 0.9, 2.2)));
    scene.add(realMesh(g.build()));
    fx.surfaceAt = (x, z) => (Math.abs(z) < 7 || (z > 22 && z < 110) ? 'asphalt' : 'snow');

    const r = mulberry32(7);
    const cars = [];
    const add = (type, x, z, yaw, opts = {}) => {
      const c = new Car(type, opts); c.place(x, z, yaw); c.y = 0; scene.add(c.root); cars.push(c); c.sync(0);
      if (opts.quiet) c.exhaustT = Infinity;   // no exhaust vapour in the studio shots
      return c;
    };

    // The lineup: every model nose to tail along the near lane, engines running.
    const kinds = MODEL_KEYS;
    const COL = { saab900: 0x1d2c4a, volvo240: 0x8a1c18, volvo740: 0x2f3d55, audi: 0x2a2c30, bmw: 0x55595d, skoda: 0xd2d2d0, golf: 0x8f9397, kombi: 0x253a2c, taxi: 0x18191b, van: 0xd0d0cc };
    const lineup = [];
    let lx = -60;
    for (const k of kinds) {
      const len = carModel(k).len;
      lx += len / 2;
      lineup.push(add(k, lx, 3.2, -Math.PI / 2, { color: COL[k], engineOn: true }));
      lx += len / 2 + 1.6;
    }
    // Studio row on the lot: one of each, 30 m apart, facing +x (the driver's side faces -z, the
    // sun); the hero Saab stands alone in front of the row so its long-lens front/rear views are clear.
    const studio = {};
    const SZ = 92;
    kinds.forEach((k, i) => { studio[k] = k === 'saab900' ? add(k, -60, 55, Math.PI / 2, { color: COL[k], engineOn: true, quiet: true, grime: 0.35 }) : add(k, -165 + i * 30, SZ, Math.PI / 2, { color: COL[k], engineOn: true, quiet: true }); });
    // Drivers: the cast where models.js has them (Ove in his Saab, Anders in the Audi, Vita
    // skjortan in the Škoda), random pedestrians otherwise. Busts are seated the way main.js must
    // do it: in the tilt frame at seatLocal().
    const seatBust = (c, side, who) => { const b = buildBust((who && CHARS[who]) || randomPed(r)); c.tilt.add(b); c.seatLocal(side, b.position); return b; };
    const hero = studio.saab900;
    hero.setPlate('OVE 559');
    seatBust(hero, 1, 'ove'); seatBust(lineup[0], 1, 'ove'); seatBust(lineup[0], -1, 'parvaneh');
    for (const k of kinds) if (k !== 'saab900') seatBust(studio[k], 1, k === 'audi' ? 'anders' : k === 'skoda' ? 'vitskjorta' : null);
    // A Volvo with a trailer and a parked, snowed-on Saab on the lot, and a Saab on the street.
    const tow = add('volvo740', 200, 40, Math.PI / 2, { color: 0x8a8e90, engineOn: true, trailer: true, quiet: true });
    seatBust(tow, 1);
    const parked = add('saab900', 200, 85, Math.PI / 2, { color: 0x7a1c18, snow: true, engineOn: false });
    const street = add('saab900', 110, 3.2, -Math.PI / 2, { color: 0x1d2c4a, engineOn: true, grime: 0.35 });
    seatBust(street, 1, 'ove');
    // The glass test car (turned by the spin views).
    const spinCar = add('golf', 150, 55, Math.PI / 2, { color: 0x8f9397, engineOn: true, quiet: true });

    const V = {};
    const look = (at, to, fov = 40) => { camera.position.set(...at); camera.lookAt(...to); camera.fov = fov; camera.updateProjectionMatrix(); };
    const around = (c, ang, dist, h = 1.4, lh = 0.75, fov = 38) => {
      const a = c.yaw + ang;
      look([c.x + Math.sin(a) * dist, c.y + h, c.z + Math.cos(a) * dist], [c.x, c.y + lh, c.z], fov);
    };
    // A long-lens elevation from 30 m (inside the LOD distance): `span` metres fill ~85 % of the width.
    const ortho = (c, ang, span, h = 0.72) => { const d = 30, hf = 2 * Math.atan((span / 0.85) / (16 / 9) / 2 / d) * 180 / Math.PI; around(c, ang, d, h, h, hf); };
    // a point in a car's own frame (+X its left, +Z forward) in world coordinates
    const loc = (c, X, Y, Z) => [c.x + X * Math.cos(c.yaw) + Z * Math.sin(c.yaw), c.y + Y, c.z - X * Math.sin(c.yaw) + Z * Math.cos(c.yaw)];
    V.lineup = () => look([lineup[0].x - 7, 3.2, 12], [lineup[0].x + 9, 0.6, 2.5], 52);
    // close-ups: the Saab's front corners (the round-2 facet / lamp slivers), its mirror, the hatch
    V.saab_corner = () => look(loc(hero, -1.9, 0.9, 3.6), loc(hero, -0.7, 0.55, 2.15), 32);
    V.saab_cornerL = () => look(loc(hero, 1.9, 0.9, 3.6), loc(hero, 0.7, 0.55, 2.15), 32);
    V.saab_mirror = () => look(loc(hero, -1.6, 1.25, 2.2), loc(hero, -0.8, 1.0, 0.65), 30);
    V.saab_hatch = () => look(loc(hero, -2.2, 2.2, -5.2), loc(hero, 0, 1.0, -1.6), 36);
    V.lineup_b = () => look([lineup[6].x - 6, 3.4, 13], [lineup[6].x + 12, 0.8, 2.5], 52);
    V.lineup_c = () => look([lineup[lineup.length - 1].x + 9, 4.5, 15], [lineup[lineup.length - 1].x - 12, 1.0, 2.5], 52);
    V.saab_street = () => around(street, -0.8, 7, 1.6, 0.7, 42);
    V.saab_front34 = () => around(hero, -0.75, 6.2, 1.25);
    V.saab_rear34 = () => around(hero, -Math.PI + 0.7, 6.2, 1.4);
    V.saab_rear34b = () => around(hero, Math.PI - 0.8, 6.5, 1.5);
    V.saab_front34b = () => around(hero, 0.8, 6.5, 1.3);
    V.saab_side = () => around(hero, Math.PI / 2, 7.5, 0.95, 0.72, 36);
    V.saab_side_ortho = () => ortho(hero, Math.PI / 2, hero.spec.len);
    V.saab_front_ortho = () => ortho(hero, 0, hero.spec.wid * 1.9, 0.75);
    V.saab_rear_ortho = () => ortho(hero, Math.PI, hero.spec.wid * 1.9, 0.75);
    V.saab_front = () => around(hero, -0.12, 6.5, 1.1, 0.7, 34);
    V.saab_rear = () => around(hero, Math.PI + 0.12, 6.5, 1.2, 0.7, 34);
    V.saab_top = () => around(hero, -0.6, 7, 4.5, 0.4, 40);
    V.saab_interior = () => around(hero, Math.PI / 2 - 0.15, 2.6, 1.35, 1.0, 50);
    V.plate = () => { const p = hero.platePos('rear'); const a = hero.yaw + Math.PI; look([p.x + Math.sin(a) * 1.4, p.y + 0.2, p.z + Math.cos(a) * 1.4], [p.x, p.y, p.z], 32); };
    V.plate_front = () => { const p = hero.platePos('front'); const a = hero.yaw; look([p.x + Math.sin(a) * 1.6 + 0.4, p.y + 0.35, p.z + Math.cos(a) * 1.6], [p.x, p.y + 0.1, p.z], 36); };
    V.hazard = () => { blinkCar = hero; around(hero, -Math.PI + 0.35, 6.5, 1.2, 0.7, 38); };
    // braking (the lit tail + brake lamps), near and far; the chase camera's view of the Saab (pivot
    // roof + 0.42, boom 4.4 + 0.8 x length, pitch 0.15, fov 54 as camera.js has it)
    V.brake = () => { brakeCar = hero; around(hero, -Math.PI + 0.3, 6.5, 1.2, 0.7, 38); };
    V.brake_far = () => { brakeCar = hero; around(hero, -Math.PI + 0.2, 26, 1.8, 0.7, 26); };
    V.saab_chase = () => { const c = street, b = 4.4 + 0.8 * c.spec.len, py = c.height + 0.42, a = c.yaw + Math.PI; look([c.x + Math.sin(a) * b * Math.cos(0.15), py + b * Math.sin(0.15), c.z + Math.cos(a) * b * Math.cos(0.15)], [c.x, py, c.z], 54); };
    V.saab_chase_brake = () => { brakeCar = street; V.saab_chase(); };
    V.saab_lit_front = () => around(hero, -0.18, 5.2, 0.95, 0.65, 36);
    V.hazard_far = () => { blinkCar = hero; around(hero, -Math.PI + 0.25, 30, 1.6, 0.7, 30); };
    V.trailer = () => { tow.trailer.yaw = tow.yaw + 0.45; tow.trailer.updatePose(); tow.trailer.sync(0, 0); around(tow, -Math.PI + 0.75, 10, 2.6, 0.6, 46); };
    V.trailer_side = () => { tow.trailer.yaw = tow.yaw; tow.trailer.updatePose(); tow.trailer.sync(0, 0); look([tow.x - 3.2, 1.3, tow.z - 10], [tow.x - 3.2, 0.7, tow.z], 46); };
    V.parked_snow = () => around(parked, -0.9, 6.5, 2.2, 0.7, 40);
    V.lod_near = () => around(studio.volvo740, -0.7, 39, 1.8, 0.7, 7);
    V.lod_far = () => around(studio.volvo740, -0.7, 52, 2.3, 0.7, 5.3);
    for (let k = 0; k < 8; k++) V['spin' + k] = () => { spinCar.place(spinCar.x, spinCar.z, (k / 8) * Math.PI * 2); spinCar.y = 0; spinCar.sync(0); look([spinCar.x - 4, 1.9, spinCar.z - 6.5], [spinCar.x, 0.8, spinCar.z], 40); };
    for (const k of kinds) {
      if (k === 'saab900') continue;
      const c = studio[k], m = c.model, d = m.len * 1.15 + 2.2;
      V[k + '_34'] = () => around(c, -0.75, d, m.height * 0.85 + 0.3, m.height * 0.45, 40);
      V[k + '_rear34'] = () => around(c, -Math.PI + 0.75, d, m.height * 0.85 + 0.4, m.height * 0.45, 40);
      V[k + '_front'] = () => around(c, -0.3, m.len * 0.75 + 1.6, m.height * 0.6 + 0.2, m.height * 0.4, 40);
      V[k + '_side'] = () => ortho(c, Math.PI / 2, m.len, m.height * 0.5);
      V[k + '_plate'] = () => { const p = c.platePos('front'); const a = c.yaw - 0.35; look([p.x + Math.sin(a) * 2.2, p.y + 0.45, p.z + Math.cos(a) * 2.2], [p.x, p.y + 0.15, p.z], 38); };
      V[k + '_hazard'] = () => { blinkCar = c; around(c, -Math.PI + 0.45, d, m.height * 0.7 + 0.4, m.height * 0.45, 40); };
    }
    let view = 'lineup', blinkCar = null, brakeCar = null;
    const all = Object.keys(V).filter((v) => !v.startsWith('spin'));
    window.__views = params.has('only') ? params.get('only').split(',').filter((v) => V[v]) : all;
    window.__setView = (v) => { view = v; blinkCar = null; brakeCar = null; for (const c of cars) { c.hazard = false; c.braking = 0; } V[v](); if (blinkCar) blinkCar.hazard = true; document.getElementById('lbl').textContent = v; };
    if (params.has('grimedbg')) {
      // the road-grime mask by height on the Golf's front face (z > 1.9)
      const geo = studio.golf.body.geometry, pos = geo.attributes.position, gr = geo.attributes.cgrime, bands = {};
      for (let i = 0; i < pos.count; i++) { if (pos.getZ(i) < 1.9) continue; const b = (pos.getY(i) * 10 | 0) / 10; (bands[b] ||= []).push(gr.getX(i)); }
      console.log('[t] grime by y', JSON.stringify(Object.fromEntries(Object.entries(bands).map(([k, v]) => [k, (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2)]))), 'golf grime', studio.golf.grime.toFixed(2), studio.golf.grimeLv);
    }
    window.__cars = cars; window.__hero = hero; window.__tow = tow; window.__studio = studio; window.__V = V;
    window.__setView(params.get('view') || 'lineup');

    let last = performance.now(), t = 0;
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
      for (const c of cars) { if (c === brakeCar) c.braking = 1; c.sync(dt); }
      if (blinkCar) blinkCar.updateLights(0.1);   // indicators caught 'on'
      fx.tick(dt);
      renderFrame();
      if ((t * 4 | 0) !== ((t - dt) * 4 | 0)) {
        const m = carModel('saab900');
        document.getElementById('stats').textContent = `calls ${gfxStats.calls}  tris ${(gfxStats.tris / 1000).toFixed(0)}k  ${gfxStats.ms.toFixed(1)} ms\nsaab tris ${m.tris | 0} (lod ${m.lodTris | 0})  wheels ${JSON.stringify(wheelStats())}`;
      }
    }
    requestAnimationFrame(loop);
    setTimeout(() => { window.__ready = true; }, 400);
  </script>
</body>
</html>
